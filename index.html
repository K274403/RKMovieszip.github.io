<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My File Index Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Welcome to My File Index</h1>
        <p>Search for files from your Telegram links</p>
    </header>

    <!-- Search Bar -->
    <div id="search-container">
        <input type="text" id="search-box" placeholder="Search files..." onkeyup="searchFiles()">
    </div>

    <!-- File List -->
    <div id="file-list">
        <ul id="files">
            <!-- Files will be listed here dynamically -->
        </ul>
    </div>

    <footer>
        <p>Created with ❤️ by Your Name</p>
    </footer>

    <script src="search.js"></script>
</body>
</html>
